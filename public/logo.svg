<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Modern Deep Sapphire to Electric Blue -->
    <linearGradient id="platBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Platform Stem Gradient: Crisp White with subtle metallic sheen -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Platform Loop Gradient: Electric Cyan to Sky Blue -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#platBg)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Layered Platform Monogram (P) -->
  <g filter="url(#glow)">
    <!-- Platform Layer 1: Vertical Foundation Stem -->
    <path
      d="M 18 17 C 18 14.79 19.79 13 22 13 L 24 13 C 26.21 13 28 14.79 28 17 L 28 47 C 28 49.21 26.21 51 24 51 L 22 51 C 19.79 51 18 49.21 18 47 Z"
      fill="url(#stemGrad)"
    />

    <!-- Platform Layer 2: Geometric Loop (Floating Upper Platform Tier) -->
    <path
      d="M 28 13 L 36.5 13 C 43.4 13 49 18.6 49 25.5 C 49 32.4 43.4 38 36.5 38 L 28 38 Z M 28 21.5 L 35.5 21.5 C 37.71 21.5 39.5 23.29 39.5 25.5 C 39.5 27.71 37.71 29.5 35.5 29.5 L 28 29.5 Z"
      fill="url(#loopGrad)"
    />

    <!-- Platform Layer 3: Tech Accent Light Line connecting the foundation and platform tier -->
    <circle cx="23" cy="20" r="2" fill="#2563EB" />
  </g>
</svg>
